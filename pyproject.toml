[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "farpoint"
version = "1.2.0"
description = "An open robot learning simulation, dataset, and evaluation platform."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.23",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest-cov>=5",
  "pytest>=8",
  "ruff>=0.9",
  "tomli>=2; python_version < '3.11'",
]
data = [
  "av>=12",
  "lerobot==0.4.4",
  "pillow>=10",
  "pyarrow>=17",
]
qa = [
  "playwright>=1.50",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"farpoint.schemas" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
